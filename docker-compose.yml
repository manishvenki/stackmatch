services:
  backend:
    image: manishvenkhi/stackmatch-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stackmatch-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      PUBLIC_STACKMATCH_URL: ${PUBLIC_STACKMATCH_URL:-http://localhost:3000}
    networks:
      - stackmatch-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: manishvenkhi/stackmatch-frontend:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: stackmatch-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stackmatch-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  stackmatch-network:
    driver: bridge